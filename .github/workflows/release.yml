# Release (R21 v1.15, owner decision 49): one click builds the Windows portable zip and drafts
# its GitHub release. Run it from Actions > Release > Run workflow on main (docs/release.md).
# The version comes from src-tauri/tauri.conf.json; the run stops when the version files differ,
# when that version already has a release, or when docs/release-notes/<version>.md is missing.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - name: Version guard
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          name=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          for other in \
            "package.json $(node -p "require('./package.json').version")" \
            "src-tauri/Cargo.toml $(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)" \
            "crates/clawdio-core/Cargo.toml $(sed -n 's/^version = "\(.*\)"/\1/p' crates/clawdio-core/Cargo.toml | head -1)"; do
            set -- $other
            if [ "$2" != "$version" ]; then
              echo "::error::$1 has version $2; src-tauri/tauri.conf.json has $version. Set the same version in all four files."
              exit 1
            fi
          done
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::v$version already has a release. Raise the version first."
            exit 1
          fi
          if [ ! -f "docs/release-notes/$version.md" ]; then
            echo "::error::docs/release-notes/$version.md is missing."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run check
      - run: cargo test --workspace
      - name: Build the executable
        run: npm run tauri build -- --no-bundle
      # R18.1: the `portable` marker next to the executable keeps the settings, the arrangement,
      # the state, the cache and the logs in a `data` folder beside it.
      - name: Portable zip and checksum
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          New-Item -ItemType Directory -Force out, portable | Out-Null
          Copy-Item "target/release/clawdio.exe" "portable/$env:NAME.exe"
          New-Item -ItemType File portable/portable | Out-Null
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_LICENSES_RUST.html, THIRD_PARTY_LICENSES_WEB.txt portable/
          $zip = "out/$env:NAME-$env:VERSION-windows-portable.zip"
          Compress-Archive -Path portable/* -DestinationPath $zip
          "$((Get-Item $zip).Name): $((Get-Item $zip).Length) bytes"
          Get-ChildItem out | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content out/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: out/*

  release:
    needs: windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: packages
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
          NAME: ${{ needs.windows.outputs.name }}
        run: |
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "$NAME $VERSION" \
            --notes-file "docs/release-notes/$VERSION.md" \
            packages/*
