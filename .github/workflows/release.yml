# Release packages (P18.3, R21): a v* tag builds the NSIS installer, the portable zip, the
# AppImage and the .deb, checks the sizes, writes SHA-256 checksums and puts everything on a
# draft GitHub release. A manual run builds the same packages as run artifacts and makes no
# release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # R20: the NSIS installer and the .deb must stay under 30 MB.
  MAX_PACKAGE_BYTES: 31457280

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Portable zip, size check and checksums
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $name = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).productName
          New-Item -ItemType Directory -Force out, portable | Out-Null
          Copy-Item "target/release/clawdio.exe" "portable/$name.exe"
          New-Item -ItemType File portable/portable | Out-Null
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_LICENSES_RUST.html, THIRD_PARTY_LICENSES_WEB.txt portable/
          Compress-Archive -Path portable/* -DestinationPath "out/$name-$version-windows-portable.zip"
          Copy-Item target/release/bundle/nsis/*.exe out/
          foreach ($installer in Get-ChildItem out/*.exe) {
            "$($installer.Name): $($installer.Length) bytes"
            if ($installer.Length -ge [long]$env:MAX_PACKAGE_BYTES) { throw "$($installer.Name) is 30 MB or more" }
          }
          Get-ChildItem out | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content out/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    runs-on: ubuntu-22.04
    # Ubuntu 22.04 (glibc 2.35) is the oldest supported Linux (R22).
    container: ubuntu:22.04
    steps:
      - name: Container packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git curl wget file xz-utils ca-certificates \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libdbus-1-dev
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Rust toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          # Installs the channel of rust-toolchain.toml.
          "$HOME/.cargo/bin/rustup" toolchain install
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: .deb
        run: npm run tauri build -- --bundles deb
      - name: AppImage
        run: npm run tauri build -- --bundles appimage
      # NOTICE inside the AppImage lists the libraries it bundles (P18.4): read them from the
      # AppImage, then build it again with that NOTICE.
      - name: AppImage library inventory and NOTICE
        run: |
          image=$(ls target/release/bundle/appimage/*.AppImage)
          chmod +x "$image"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$image" --appimage-extract > /dev/null)
          scripts/appimage-libs.sh "$RUNNER_TEMP/squashfs-root" "$RUNNER_TEMP/appimage-libs.tsv"
          node scripts/notice.mjs --appimage-libs "$RUNNER_TEMP/appimage-libs.tsv"
          npm run tauri build -- --bundles appimage
      - name: Size check and checksums
        run: |
          mkdir -p out
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage out/
          for package in out/*.deb; do
            size=$(stat -c %s "$package")
            echo "$(basename "$package"): $size bytes"
            [ "$size" -lt "$MAX_PACKAGE_BYTES" ] || { echo "$package is 30 MB or more"; exit 1; }
          done
          for image in out/*.AppImage; do echo "$(basename "$image"): $(stat -c %s "$image") bytes (recorded, R20)"; done
          (cd out && sha256sum * > SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    needs: [windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --draft --title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
