# cargo-deny (P18.4): licenses on the allow-list only, crates from crates.io only.

[graph]
all-features = false
# The shipped targets (R21). Crates only other platforms build are not shipped.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.9

[advisories]
# Vulnerabilities and yanked crates fail anywhere in the graph. "Unmaintained" notices fail
# for the crates this workspace names itself; deeper ones (paste under lofty, proc-macro-error
# under gtk-rs) can only change upstream.
unmaintained = "workspace"

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The two workspace crates are not published, so their path dependency has no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
