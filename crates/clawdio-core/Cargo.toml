[package]
name = "clawdio-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Penguin-Pants/Clawdio"
publish = false

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
lofty = "=0.25.4"
log = "=0.4.34"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "pcm", "adpcm"] }
tempfile = "=3.27.0"
walkdir = "=2.5.0"
ts-rs = "=12.0.1"
thiserror = "=2.0.21"
unicode-normalization = "=0.1.25"

[dev-dependencies]
