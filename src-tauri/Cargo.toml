[package]
name = "clawdio"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Penguin-Pants/Clawdio"
publish = false

[lib]
name = "clawdio_lib"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[features]
# Milestone 0 test data (D35, C19). Off by default; never in a release bundle. P6.7 deletes it.
fixtures = ["dep:image"]

[dependencies]
clawdio-core = { path = "../crates/clawdio-core" }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"], optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.3", features = ["protocol-asset"] }

[target.'cfg(windows)'.dependencies]
log = "=0.4.34"
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
