[package]
name = "clawdio"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Penguin-Pants/Clawdio"
publish = false

[lib]
name = "clawdio_lib"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[features]
# Milestone 0 test data (D35, C19). Off by default; never in a release bundle. P6.7 deletes it.
fixtures = ["dep:image"]

[dependencies]
clawdio-core = { path = "../crates/clawdio-core" }
log = "=0.4.34"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "mp3", "vorbis", "wav", "symphonia-adpcm"] }
serde_json = "=1.0.154"
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "adpcm"] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"], optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.3", features = [] }

[dev-dependencies]
tauri = { version = "=2.12.3", features = ["test"] }
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
