[package]
name = "clawdio"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Penguin-Pants/Clawdio"
publish = false

[lib]
name = "clawdio_lib"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
clawdio-core = { path = "../crates/clawdio-core" }
log = "=0.4.34"
rodio = { version = "=0.22.2", default-features = false, features = ["playback"] }
serde_json = "=1.0.154"
souvlaki = "=0.8.3"
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "adpcm"] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.3", features = [] }

[dev-dependencies]
tauri = { version = "=2.12.3", features = ["test"] }
tempfile = "=3.27.0"
httpmock = { version = "=0.8.3", default-features = false }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
# Microphone detector (P20.2): audio sessions and the privacy consent store. Same version as
# the copy Tauri already uses.
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "=0.9.12"
libc = "=0.2.190"
